seed: 42
paths:
  data_dir: data
  tile_dir: data/tiles_smoke_v4
  output_dir: outputs_smoke_v4
  checkpoint_dir: checkpoints_smoke_v4
  prediction_dir: outputs_smoke_v4/predictions
  vector_dir: outputs_smoke_v4/vectors
areas:
- name: kelly_smoke
  description: 1 km smoke crop
  bbox:
  - -111.615
  - 43.63
  - -111.602
  - 43.64
  imagery: data/kelly_smoke/naip_rgbn.tif
  dtm: data/kelly_smoke/3dep_dtm.tif
  trails: data/kelly_smoke/trails.gpkg
tiling:
  tile_size: 512
  overlap: 128
  resolution_m: 0.6
  trail_buffer_m:
    path: 1.0
    footway: 1.0
    track: 1.5
    default: 1.0
terrain:
  local_relief_radius_px: 25
  channel_gain: 1.85
model:
  encoder_name: resnet34
  encoder_weights: imagenet
  in_channels: 7
  classes: 1
  dilated_center: false
loss:
  name: weighted_bce_dice
  pixel_weights:
    background: 1.0
    path: 1.0
    track: 0.30
    uncertain: 0.65
training:
  batch_size: 2
  epochs: 1
  learning_rate: 0.0003
  weight_decay: 0.0001
  val_fraction: 0.15
  test_fraction: 0.15
  block_size_m: 300
  num_workers: 0
  mixed_precision: true
  checkpoint_path: checkpoints_smoke_v4/smoke.pt
inference:
  threshold: 0.5
postprocess:
  threshold: 0.5
  simplify_m: 1.0
  dedup_tolerance_m: 3.0
downloads:
  max_raster_km2: 25.0
  max_raster_pixels: 70000000
  max_download_gb: 2.0
  max_extracted_gb: 8.0
  max_3dep_products: 200
  max_osm_km2: 5000.0
  naip_stac_url: https://planetarycomputer.microsoft.com/api/stac/v1
  naip_collection: naip
  naip_asset: image
  planetary_computer_sign_url: https://planetarycomputer.microsoft.com/api/sas/v1/sign
  tnm_products_url: https://tnmaccess.nationalmap.gov/api/v1/products
  tnm_1m_dataset: Digital Elevation Model (DEM) 1 meter
  dtm_resolution_m: 1.0
  overpass_url: https://overpass-api.de/api/interpreter
  overpass_token_env: TRAILNET_OVERPASS_TOKEN
  cache_dir: data/_cache
  ugrc_trails_url: https://services1.arcgis.com/99lidPhWCzftIe9K/ArcGIS/rest/services/TrailsAndPathways/FeatureServer/0/query
  usfs_trails_url: https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_TrailNFSPublish_01/MapServer/0/query
